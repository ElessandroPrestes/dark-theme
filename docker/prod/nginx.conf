server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip para assets de texto
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cache imutável para assets com hash gerado pelo Angular
    location ~* \.[0-9a-f]{8,}\.(js|css|woff2?|ttf|eot|ico|png|jpg|webp|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Sem cache para index.html (sempre busca versão mais recente)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Endpoint de health check para o Docker
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # Fallback SPA — suporte ao Angular Router em rotas diretas
    location / {
        try_files $uri $uri/ /index.html;
    }
}
