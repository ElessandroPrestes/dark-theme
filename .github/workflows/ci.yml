name: CI

on:
  push:
    branches: [develop, dev, main]
  pull_request:
    branches: [develop, dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade de Código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Verificar formatação
        run: npm run format:check

      - name: Testes com cobertura
        run: npm run test:ci

      - name: Upload de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  build-angular:
    name: Build Angular
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Build de produção
        run: npm run build

      - name: Upload do artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: dist-angular
          path: dist/dark-theme/
          retention-days: 7

  build-docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: build-angular
    steps:
      - uses: actions/checkout@v4

      - name: Download do artefato Angular
        uses: actions/download-artifact@v4
        with:
          name: dist-angular
          path: dist/dark-theme/

      - name: Build da imagem Docker de produção
        run: docker build -f docker/prod/Dockerfile -t dark-theme:${{ github.sha }} .

      - name: Testar healthcheck da imagem
        run: |
          docker run -d --name test-container -p 8080:80 dark-theme:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8080/health || (docker logs test-container && exit 1)
          docker stop test-container
          docker rm test-container
