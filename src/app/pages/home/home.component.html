<main id="main-content" class="auth-page" tabindex="-1" aria-labelledby="login-heading">
  <div class="auth-page__glow auth-page__glow--primary" aria-hidden="true"></div>
  <div class="auth-page__glow auth-page__glow--secondary" aria-hidden="true"></div>

  <section class="auth-layout">
    <section class="auth-shell">
      <div class="auth-panel">
        <header class="auth-header">
          <div class="brand" aria-label="Dark Theme">
            <span class="brand__logo">DT</span>
            <span class="brand__copy">
              <strong>Dark Theme</strong>
              <span>Login com tema adaptável</span>
            </span>
          </div>

          <div class="theme-switcher">
            <div
              class="theme-switcher__controls"
              role="group"
              aria-label="Selecionar tema"
              [class.theme-switcher__controls--light]="!themeService.isDark()"
            >
              <button
                type="button"
                class="theme-switcher__option"
                [class.theme-switcher__option--active]="!themeService.isDark()"
                aria-label="Ativar modo claro"
                [attr.aria-pressed]="!themeService.isDark()"
                (click)="selectTheme('light')"
              >
                <mat-icon aria-hidden="true">light_mode</mat-icon>
              </button>

              <button
                type="button"
                class="theme-switcher__option"
                [class.theme-switcher__option--active]="themeService.isDark()"
                aria-label="Ativar modo escuro"
                [attr.aria-pressed]="themeService.isDark()"
                (click)="selectTheme('dark')"
              >
                <mat-icon aria-hidden="true">dark_mode</mat-icon>
              </button>
            </div>

            <p class="theme-switcher__description" aria-live="polite">
              {{ selectedThemeDescription() }}
            </p>
          </div>
        </header>

        <form class="login-card" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
          <div class="login-card__header">
            <div>
              <p class="eyebrow eyebrow--compact">Sign in</p>
              <h1 id="login-heading">Bem-vindo de volta</h1>
            </div>
          </div>

          <label class="field">
            <span class="field__label">Email corporativo</span>
            <input
              class="field__input"
              type="email"
              formControlName="email"
              autocomplete="email"
              placeholder="voce@empresa.com"
            />

            @if (email.invalid && email.touched) {
              <span class="field__error" role="alert">Digite um e-mail válido.</span>
            }
          </label>

          <label class="field">
            <span class="field__label">Senha</span>

            <div class="field__control">
              <input
                class="field__input"
                [type]="showPassword() ? 'text' : 'password'"
                formControlName="password"
                autocomplete="current-password"
                placeholder="Minimo de 8 caracteres"
              />

              <button
                type="button"
                class="field__action"
                [attr.aria-label]="passwordButtonLabel()"
                (click)="togglePasswordVisibility()"
              >
                {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
              </button>
            </div>

            @if (password.invalid && password.touched) {
              <span class="field__error" role="alert">Use ao menos 8 caracteres.</span>
            }
          </label>

          <div class="login-card__options">
            <label class="checkbox">
              <input type="checkbox" formControlName="rememberMe" />
              <span>Manter sessão neste dispositivo</span>
            </label>
          </div>

          <button class="submit-button" type="submit">Entrar</button>

          @if (submitted()) {
            <p class="login-card__success" role="status">
              Login demo validado. O fluxo está pronto para integração com autenticação real.
            </p>
          }
        </form>
      </div>

      <aside class="auth-art" aria-hidden="true">
        <div class="auth-art__frame">
          <span class="auth-art__line auth-art__line--left"></span>
          <span class="auth-art__line auth-art__line--right"></span>
          <span class="auth-art__star auth-art__star--one"></span>
          <span class="auth-art__star auth-art__star--two"></span>
          <span class="auth-art__star auth-art__star--three"></span>
          <span class="auth-art__orb auth-art__orb--primary"></span>
          <span class="auth-art__orb auth-art__orb--secondary"></span>
          <span class="auth-art__glow"></span>
        </div>
      </aside>
    </section>
  </section>
</main>
